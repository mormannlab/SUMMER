name: summer
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - ipython
  - ipykernel
  - tabulate
  # Core scientific stack
  - numpy
  - pandas
  - matplotlib
  - seaborn
  # Neuro / plotting dependencies
  - nilearn
  - pynwb
  # General utilities
  - requests
  - tqdm
  # PyTorch Lightning training
  - pytorch
  - pytorch-lightning
  # Pip-only dependencies
  - pip:
      - invoke==2.2.0
      - zetapy
      - dandi>=0.74.0